name: Skill checks

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, edited, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  scope:
    permissions:
      contents: read
      issues: read
      pull-requests: read
    uses: Oddmash/.github/.github/workflows/ci-scope.yml@9a2077a4b0ff9188ef2cb2ab306f181a134d3110
    with:
      profile: skills
  verify:
    needs: scope
    if: always()
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Confirm scope passed
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
        run: test "$SCOPE_RESULT" = success
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate skill manifests and relative links
        run: python3 scripts/install.py --validate
      - name: Run installation tests when repository structure or tooling changes
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          base=''
          case "$GITHUB_EVENT_NAME" in
            pull_request) base=$(git rev-parse HEAD^1) ;;
            push) base=$(git rev-parse --quiet --verify "${BEFORE}^{commit}" || true) ;;
          esac

          if [[ -n "$base" ]] &&
            git diff --quiet --no-renames --diff-filter=ACDRTUXB "$base" HEAD &&
            git diff --quiet --no-renames "$base" HEAD -- . \
              ':(glob,exclude)skills/**/*.md' ':(glob,exclude)products/**/*.md' \
              ':(glob,exclude)docs/**/*.md' ':(glob,exclude)*.md'; then
            echo 'Existing Markdown files changed. Manifest and link validation is sufficient.'
          else
            python3 -m unittest discover -s tests
          fi
