name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, edited, ready_for_review]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  scope:
    permissions:
      contents: read
      issues: read
      pull-requests: read
    uses: Oddmash/.github/.github/workflows/ci-scope.yml@ci-v1
    with:
      profile: agents
  test:
    needs: scope
    if: needs.scope.outputs.runtime == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Find completed tests for this PR revision
        if: github.event_name == 'pull_request' && github.event.action == 'edited' && github.run_attempt == 1
        continue-on-error: true
        id: prior
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const { join } = require('node:path');
            const { findGitHubTests } = await import(pathToFileURL(join(process.env.GITHUB_WORKSPACE, 'scripts/ci-evidence.mjs')).href);
            const { repository, pull_request: pr } = context.payload;
            const run = await findGitHubTests({
              repository: repository.full_name,
              head: pr.head.sha,
              revision: context.sha,
              event: 'pull_request',
              branch: pr.head.ref,
              headRepository: pr.head.repo?.id,
              currentRun: context.runId,
            }, process.env.GITHUB_TOKEN);
            if (run) core.notice(`Reusing full tests from CI run ${run} for ${context.sha}.`);
            core.setOutput('run', run ?? '');
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        if: steps.prior.outputs.run == ''
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        if: steps.prior.outputs.run == ''
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
        if: steps.prior.outputs.run == ''
      - run: pnpm run typecheck
        if: steps.prior.outputs.run == ''
      - run: pnpm test
        if: steps.prior.outputs.run == ''
      - run: pnpm --filter @oddmash/agents-console typecheck
        if: steps.prior.outputs.run == ''
      - run: pnpm --filter @oddmash/agents-console build
        if: steps.prior.outputs.run == ''
      - name: Confirm console server denies unauthenticated operator requests
        if: steps.prior.outputs.run == ''
        run: |
          pnpm --filter @oddmash/agents-console run dev:api > /tmp/console-smoke.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:4312/api/availability > /dev/null; then break; fi
            sleep 1
          done
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:4312/api/status)" = 401
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:4312/api/models)" = 401
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' -X POST -H 'Content-Type: application/json' --data '{}' http://127.0.0.1:4312/api/models)" = 401
      - name: Record full test result for ${{ github.sha }}
        if: steps.prior.outputs.run == ''
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

  catalog:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read
    defaults:
      run:
        working-directory: catalog
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - run: python3 scripts/install.py --validate
      - run: python3 -m unittest discover -s tests

  verify:
    needs: [scope, test, catalog]
    if: always()
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Confirm appropriate checks passed
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          CATALOG_RESULT: ${{ needs.catalog.result }}
          RUN_0: ${{ needs.scope.outputs.runtime }}
          RESULT_0: ${{ needs.test.result }}
        run: |
          test "$SCOPE_RESULT" = success
          test "$CATALOG_RESULT" = success
          verify() { case "$1:$2" in true:success|false:skipped) return 0 ;; *) return 1 ;; esac; }
          verify "$RUN_0" "$RESULT_0"
