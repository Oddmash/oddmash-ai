name: Deploy Production
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Latest published stable release tag
        required: true
        type: string
      candidate_sha:
        description: Exact reviewed main release commit SHA
        required: true
        type: string
      promote:
        description: Promote the newly staged and tested production deployment
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: reviewer-vercel-production
  cancel-in-progress: false
env:
  VERCEL_ORG_ID: team_hAp7kLycu6rwgAWypgcghemA
  VERCEL_PROJECT_ID: prj_RKccMkGPH0rn8GteNrNN2hQiaik5
  VERCEL_CLI_VERSION: '58.4.4'
  ENABLE_EXPERIMENTAL_COREPACK: '1'
jobs:
  release:
    if: github.repository == 'Oddmash/oddmash-ai' && github.repository_id == '1474100040' && github.actor_id == '135234546' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && vars.ODDMASH_UNIFIED_CUTOVER_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      commit: ${{ steps.resolve.outputs.commit }}
      tag: ${{ steps.resolve.outputs.tag }}
      test-run: ${{ steps.prior.outputs.run }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: Verify latest published stable release
        id: resolve
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          EXPECTED_RELEASE_COMMIT: ${{ inputs.candidate_sha }}
        run: node scripts/validate-release.mjs
      - name: Find completed main tests for the release commit
        id: prior
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ steps.resolve.outputs.commit }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          import { findGitHubTests } from './scripts/ci-evidence.mjs';

          const run = await findGitHubTests({
            repository: process.env.GITHUB_REPOSITORY,
            head: process.env.RELEASE_COMMIT,
            revision: process.env.RELEASE_COMMIT,
            event: 'push',
            branch: 'main',
            headRepository: Number(process.env.GITHUB_REPOSITORY_ID),
          }, process.env.GITHUB_TOKEN);
          if (run) appendFileSync(process.env.GITHUB_OUTPUT, `run=${run}\n`);
          NODE
  deploy:
    needs: release
    if: needs.release.result == 'success' && vars.ODDMASH_UNIFIED_CUTOVER_ENABLED == 'true' && vars.VERCEL_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.release.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run typecheck
        if: needs.release.outputs.test-run == ''
      - run: pnpm test
        if: needs.release.outputs.test-run == ''
      - name: Record reused test evidence
        if: needs.release.outputs.test-run != ''
        env:
          CI_RUN: ${{ needs.release.outputs.test-run }}
        run: printf 'Reused full tests from [CI run %s](%s/%s/actions/runs/%s) for the exact release commit.\n' "$CI_RUN" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$CI_RUN" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify pinned catalog bundle
        run: node scripts/bundle-agent-skills.mjs --check
      - name: Verify independent catalog
        working-directory: catalog
        run: |
          python3 scripts/install.py --validate
          python3 -m unittest discover -s tests
      - name: Pull production settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          test -n "$VERCEL_TOKEN"
          pnpm --reporter=silent dlx "vercel@$VERCEL_CLI_VERSION" pull --yes --environment=production
      - run: pnpm --reporter=silent dlx "vercel@$VERCEL_CLI_VERSION" build --prod
        env:
          VITE_OPERATOR_RELEASE_TAG: ${{ needs.release.outputs.tag }}
      - name: Confirm combined build output
        run: |
          node --input-type=module <<'NODE'
          import { existsSync, readdirSync } from 'node:fs';
          const expected = ['static/index.html', 'functions/api/github.func/.vc-config.json', 'functions/api/advisory.func/.vc-config.json', 'functions/api/review-jobs.func/.vc-config.json', 'functions/api/[resource].func/.vc-config.json', 'functions/api/auth/signin/github.func/.vc-config.json', 'functions/api/auth/callback/github.func/.vc-config.json'];
          for (const entry of expected) if (!existsSync('.vercel/output/' + entry)) throw new Error('Missing combined deployment artifact: ' + entry);
          const count = readdirSync('.vercel/output/functions', { recursive: true }).filter(entry => entry.endsWith('.vc-config.json')).length;
          if (count > 12) throw new Error('Hobby function budget exceeded: ' + count);
          console.log('Function artifacts: ' + count);
          NODE
      - name: Stage production
        id: stage
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          url="$(pnpm --reporter=silent dlx "vercel@$VERCEL_CLI_VERSION" deploy --prebuilt --prod --skip-domain --yes)"
          DEPLOYMENT_URL="$url" node --input-type=module -e 'const u = new URL(process.env.DEPLOYMENT_URL); if (u.protocol !== "https:" || u.origin !== process.env.DEPLOYMENT_URL || !u.hostname.endsWith(".vercel.app")) process.exit(1)'
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Smoke test staged endpoint
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          DEPLOYMENT_URL: ${{ steps.stage.outputs.url }}
          REVIEWER_WEBHOOK_SECRET: ${{ secrets.REVIEWER_WEBHOOK_SECRET }}
        run: |
          node --input-type=module -e '
            const secret = process.env.VERCEL_AUTOMATION_BYPASS_SECRET;
            if (!secret) throw new Error("Configure VERCEL_AUTOMATION_BYPASS_SECRET for protected staging");
            const endpoint = new URL("/api/github", process.env.DEPLOYMENT_URL);
            const response = await fetch(endpoint, { headers: { "x-vercel-protection-bypass": secret }, redirect: "error", signal: AbortSignal.timeout(30000) });
            if (!response.ok || (await response.json()).status !== "ok") throw new Error("Staged endpoint failed health check");
            const webhook = process.env.REVIEWER_WEBHOOK_SECRET;
            if (webhook) {
              const { createHmac } = await import("node:crypto");
              const body = "{}";
              const headers = { "x-vercel-protection-bypass": secret, "content-type": "application/json", "x-github-event": "ping" };
              const unsigned = await fetch(endpoint, { method: "POST", headers, body, redirect: "error", signal: AbortSignal.timeout(30000) });
              if (unsigned.status !== 401) throw new Error("Unsigned webhook was not rejected");
              const signature = "sha256=" + createHmac("sha256", webhook).update(body).digest("hex");
              const signed = await fetch(endpoint, { method: "POST", headers: { ...headers, "x-hub-signature-256": signature }, body, redirect: "error", signal: AbortSignal.timeout(30000) });
              if (signed.status !== 200) throw new Error("Signed webhook ping failed");
            }
          '
      - name: Smoke test staged console routes
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          DEPLOYMENT_URL: ${{ steps.stage.outputs.url }}
        run: |
          node --input-type=module <<'NODE'
          const secret = process.env.VERCEL_AUTOMATION_BYPASS_SECRET;
          if (!secret) throw new Error('Missing staging protection credential');
          const origin = process.env.DEPLOYMENT_URL;
          const request = (path, method = 'GET') => fetch(new URL(path, origin), { method, headers: { 'x-vercel-protection-bypass': secret }, redirect: 'error', signal: AbortSignal.timeout(30000) });
          const shell = await request('/');
          if (!shell.ok || !shell.headers.get('content-type')?.includes('text/html') || !(await shell.text()).includes('id="root"')) throw new Error('Console shell unavailable');
          for (const path of ['/ko', '/en/settings', '/ko/activity', '/en/usage', '/ko/contributors']) {
            const page = await request(path);
            if (!page.ok || !page.headers.get('content-type')?.includes('text/html') || !(await page.text()).includes('id="root"')) throw new Error('Localized console shell unavailable: ' + path);
          }
          const icon = await request('/oddmash-logo.png');
          if (!icon.ok || !icon.headers.get('content-type')?.includes('image/png')) throw new Error('Console favicon unavailable');
          const availability = await request('/api/availability');
          if (!availability.ok || typeof (await availability.json()).configured !== 'boolean') throw new Error('Console availability route unavailable');
          const session = await request('/api/auth/session');
          if (![400, 503].includes(session.status) || !session.headers.get('cache-control')?.includes('no-store')) throw new Error('Console auth route unavailable or accepted noncanonical staging origin');
          for (const [path, method] of [['/api/auth/signin/github', 'POST'], ['/api/auth/callback/github', 'GET']]) {
            const response = await request(path, method);
            if (![400, 503].includes(response.status) || !response.headers.get('cache-control')?.includes('no-store') || !response.headers.get('content-type')?.includes('application/json')) throw new Error('Console provider route unavailable or accepted noncanonical staging origin');
          }
          const controls = await request('/api/controls');
          if (controls.status !== 401 || !controls.headers.get('cache-control')?.includes('no-store')) throw new Error('Console controls failed unauthenticated denial');
          const models = await request('/api/models');
          if (models.status !== 401 || !models.headers.get('cache-control')?.includes('no-store')) throw new Error('Console models failed unauthenticated denial');
          for (const path of ['/api/status', '/api/contributors', '/api/adoption']) {
            const response = await request(path);
            if (response.status !== 401 || !response.headers.get('cache-control')?.includes('no-store')) throw new Error('Console failed unauthenticated denial: ' + path);
          }
          const unknown = await request('/api/not-a-console-resource');
          if (unknown.status !== 404) throw new Error('Unknown console resource did not fail closed');
          NODE
      - name: Recheck latest release before promotion
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
          EXPECTED_RELEASE_COMMIT: ${{ needs.release.outputs.commit }}
        run: node scripts/validate-release.mjs
      - name: Promote tested deployment
        if: inputs.promote == true
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEPLOYMENT_URL: ${{ steps.stage.outputs.url }}
        run: pnpm --reporter=silent dlx "vercel@$VERCEL_CLI_VERSION" promote "$DEPLOYMENT_URL" --yes
      - name: Record production release
        if: inputs.promote == true
        env:
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.release.outputs.commit }}
          DEPLOYMENT_URL: ${{ steps.stage.outputs.url }}
        run: |
          printf '## Production release\n\n- Tag: %s\n- Commit: %s\n- Deployment: %s\n' "$RELEASE_TAG" "$RELEASE_COMMIT" "$DEPLOYMENT_URL" >> "$GITHUB_STEP_SUMMARY"
      - name: Record staged qualification
        if: inputs.promote == false
        env:
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.release.outputs.commit }}
          DEPLOYMENT_URL: ${{ steps.stage.outputs.url }}
        run: |
          printf '## Staged qualification (not promoted)\n\n- Tag: %s\n- Commit: %s\n- Deployment: %s\n' "$RELEASE_TAG" "$RELEASE_COMMIT" "$DEPLOYMENT_URL" >> "$GITHUB_STEP_SUMMARY"
